server {
    listen 80;
    server_name sweetseek.top www.sweetseek.top;

    # 日志文件
    access_log /www/wwwlogs/sweetseek.top.access.log;
    error_log /www/wwwlogs/sweetseek.top.error.log;

    # 客户端最大上传大小
    client_max_body_size 50M;

    # 前端静态文件 (React Build)
    location / {
        root /www/wwwroot/FCN_SweetSeek/frontend-react/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存优化
    location /assets/ {
        root /www/wwwroot/FCN_SweetSeek/frontend-react/dist;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 数据文件不做缓存，确保实时更新
    location /data/ {
        root /www/wwwroot/FCN_SweetSeek/frontend-react/dist;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # 兼容旧版静态文件 (如果有)
    location /static/ {
        proxy_pass http://127.0.0.1:5001/static/;
    }
}

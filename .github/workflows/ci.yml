name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.13.0'
          if [[ "${{ matrix.python-version }}" == "3.11" ]]; then
            grep -vE '^[[:space:]]*torch([<>=!~]|$)' requirements-production-py311-linux.txt > /tmp/requirements-no-torch.txt
            python -m pip install --prefer-binary -r /tmp/requirements-no-torch.txt
          else
            grep -vE '^[[:space:]]*torch([<>=!~]|$)' requirements.txt > /tmp/requirements-no-torch.txt
            python -m pip install --prefer-binary -r /tmp/requirements-no-torch.txt -r requirements-dev.txt
            python -m pip install gunicorn gevent
          fi
          python -m pip check
      - name: Runtime smoke
        run: python -c 'import torch, faiss, flask; assert torch.version.cuda is None; print(torch.__version__, faiss.__version__)'
      - name: Backend tests
        env:
          STRUCTURE_TOOLS_ENABLED: "false"
          MD_BUILDER_ENABLED: "true"
          DOCKING_ENABLED: "false"
          RAG_EAGER_INIT: "false"
          RAG_ALLOW_AUTO_BUILD: "false"
        run: python -m pytest -q
      - name: Citation catalogs
        run: python scripts/verify_citation_catalogs.py
      - name: Static checks
        if: matrix.python-version == '3.11'
        run: |
          ruff check services/rag_runtime.py services/citation_catalog.py scripts/verify_rag_runtime.py scripts/verify_md_builder_runtime.py scripts/verify_citation_catalogs.py scripts/maintenance/deploy/record_release_observation.py tests/test_structure_feature_gate.py tests/test_deploy_scripts.py
          mypy services/rag_runtime.py
      - name: Capture resolved server requirements
        if: matrix.python-version == '3.11'
        run: |
          python -m pip freeze --all | diff -u requirements-production-py311-linux.txt -
          cp requirements-production-py311-linux.txt requirements-resolved-py311-linux.txt
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: python311-runtime
          path: requirements-resolved-py311-linux.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Test and build
        working-directory: frontend-react
        env:
          VITE_STRUCTURE_TOOLS_ENABLED: "false"
          VITE_MD_BUILDER_ENABLED: "true"
          VITE_DOCKING_ENABLED: "false"
        run: |
          npm ci
          npm test -- --reporter=dot
          npm run build
          tar -czf ../sweetseek-frontend-${GITHUB_SHA}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: sweetseek-frontend-${{ github.sha }}.tar.gz

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: python311-runtime
          path: release
      - name: Build checksums and manifest
        run: |
          # Calculate citation catalog checksum from checked-out repo
          CATALOG_SHA="$(sha256sum data/citations/manifest.json | awk '{print $1}')"
          SWEETMETA_ARCHIVE="SweetDatabase_v1.0.7_20261005.sqlite.xz"
          SWEETMETA_DB_SHA="04afa9f54a810639a6ff4719ac64f1f4af2984e41c4206fc00343a058fe5eae7"
          python scripts/verify_sweetmeta_release.py \
            --archive "data/sweetmeta_reviewed_20261005/${SWEETMETA_ARCHIVE}" \
            --expected-sha256 "$SWEETMETA_DB_SHA"
          cp "data/sweetmeta_reviewed_20261005/${SWEETMETA_ARCHIVE}" release/

          # Generate deployment manifest and checksums in release directory
          cd release
          printf '{"schema_version":3,"commit":"%s","md_builder_enabled":true,"docking_enabled":false,"citation_style":"GB/T 7714-2015","citation_catalog_manifest_sha256":"%s","sweetmeta_version":"v1.0.7","sweetmeta_database_archive":"%s","sweetmeta_database_sha256":"%s"}\n' "$GITHUB_SHA" "$CATALOG_SHA" "$SWEETMETA_ARCHIVE" "$SWEETMETA_DB_SHA" > manifest.json
          sha256sum sweetseek-frontend-${GITHUB_SHA}.tar.gz requirements-resolved-py311-linux.txt "$SWEETMETA_ARCHIVE" manifest.json > SHA256SUMS
      - name: Publish immutable deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "deploy-${GITHUB_SHA}" release/* \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Deploy ${GITHUB_SHA}" \
            --notes "CI-verified SweetSeek web/RAG deployment assets. MD Builder enabled; Docking disabled."

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add host to known_hosts
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

          # Trim whitespace from secrets
          DEPLOY_USER=$(echo "$DEPLOY_SSH_USER" | tr -d '[:space:]')
          DEPLOY_HOST=$(echo "$DEPLOY_SSH_HOST" | tr -d '[:space:]')

          # Upload deployment script via SSH (avoids server firewall/network issues)
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/maintenance/deploy/deploy_from_git.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy-${GITHUB_SHA}.sh"

          # Execute deployment script on server
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 700 '/tmp/deploy-${GITHUB_SHA}.sh' && \
             sudo bash '/tmp/deploy-${GITHUB_SHA}.sh' --commit ${GITHUB_SHA}"

          echo "✅ Deployment completed for commit ${GITHUB_SHA}"

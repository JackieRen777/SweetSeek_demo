name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check services tests config.py logger.py metadata_storage.py pdf_metadata_extractor.py persistent_storage.py incremental_indexer.py

      - name: Type check
        run: |
          mypy services

      - name: Tests
        run: |
          pytest --cov=services --cov=metadata_storage --cov=pdf_metadata_extractor --cov=persistent_storage --cov-report=term-missing

      - name: Security audit (dependencies)
        run: |
          pip-audit -r requirements.txt

      - name: Security scan (source)
        run: |
          bandit -r . -q

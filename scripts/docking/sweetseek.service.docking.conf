# Install as /etc/systemd/system/sweetseek.service.d/docking.conf
[Service]
Environment=DOCKING_WORKERS=1
Environment=DOCKING_COMMAND=/opt/sweetseek/scripts/docking/run_docking.sh {kind} "{receptor}" "{ligand}" "{workspace}" "{poses}" "{exhaustiveness}"
Environment=DOCKING_OUTPUT_FILE=poses.pdb
Environment=DOCKING_TIMEOUT_SECONDS=3600
